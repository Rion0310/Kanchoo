<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>MONSTER WAR - ROOM</title>

    <link
        rel="stylesheet"
        href="room.css"
    >

</head>

<body>

<main class="room-screen">

    <!-- ========================================
         ヘッダー
    ========================================= -->

    <header class="room-header">

        <div class="room-game-title">
            MONSTER WAR
        </div>

        <div class="room-title">
            BATTLE ROOM
        </div>

    </header>


    <!-- ========================================
         プレイヤー情報
    ========================================= -->

    <section class="player-section">

        <div class="section-label">
            PLAYER
        </div>

        <div
            id="player-name-display"
            class="player-name"
        >
            PLAYER
        </div>

    </section>


    <!-- ========================================
         ルーム情報
    ========================================= -->

    <section class="room-info-section">

        <div class="section-label">
            ROOM
        </div>

        <div
            id="room-id-display"
            class="room-id"
        >
            ------
        </div>

    </section>


    <!-- ========================================
         卓選択
    ========================================= -->

    <section class="table-section">

        <div class="section-label">
            SELECT TABLE
        </div>


        <!-- ====================================
             対戦卓
        ===================================== -->

        <button
            type="button"
            id="battle-table"
            class="table-card"
        >

            <div class="table-card-header">

                <div class="table-name">
                    対戦卓
                </div>

                <div class="table-type">
                    BATTLE TABLE
                </div>

            </div>


            <div class="battle-players">

                <div class="battle-player">

                    <div class="player-number">
                        PLAYER 1
                    </div>

                    <div
                        id="battle-player-1"
                        class="battle-player-name"
                    >
                        WAITING
                    </div>

                    <div
                        id="battle-ready-1"
                        class="ready-status"
                    >
                        WAITING
                    </div>

                </div>


                <div class="vs-mark">
                    VS
                </div>


                <div class="battle-player">

                    <div class="player-number">
                        PLAYER 2
                    </div>

                    <div
                        id="battle-player-2"
                        class="battle-player-name"
                    >
                        WAITING
                    </div>

                    <div
                        id="battle-ready-2"
                        class="ready-status"
                    >
                        WAITING
                    </div>

                </div>

            </div>


            <div class="table-description">
                プレイヤー同士で対戦します
            </div>

        </button>


        <!-- ====================================
             観戦卓
        ===================================== -->

        <button
            type="button"
            id="spectator-table"
            class="table-card"
        >

            <div class="table-card-header">

                <div class="table-name">
                    観戦卓
                </div>

                <div class="table-type">
                    SPECTATOR TABLE
                </div>

            </div>


            <div class="spectator-info">

                <div
                    id="spectator-count"
                    class="spectator-count"
                >
                    0
                </div>

                <div class="spectator-label">
                    SPECTATORS
                </div>

            </div>


            <div class="table-description">
                対戦中のプレイヤーを観戦します
            </div>

        </button>

    </section>


    <!-- ========================================
         選択中の卓
    ========================================= -->

    <section class="selection-section">

        <div class="section-label">
            SELECTED TABLE
        </div>

        <div
            id="selected-table"
            class="selected-table"
        >
            卓を選択してください
        </div>

    </section>


    <!-- ========================================
         操作ボタン
    ========================================= -->

    <section class="action-section">

        <button
            type="button"
            id="ready-button"
            class="action-button ready-button"
        >
            <span class="button-label">
                準備
            </span>

            <span class="button-subtitle">
                READY
            </span>

        </button>


        <button
            type="button"
            id="back-button"
            class="action-button back-button"
        >
            <span class="button-label">
                戻る
            </span>

            <span class="button-subtitle">
                BACK
            </span>

        </button>

    </section>


    <!-- ========================================
         接続状態
    ========================================= -->

    <div
        id="connection-status"
        class="connection-status"
    >
        CONNECTING...
    </div>


    <!-- ========================================
         JavaScript
    ========================================= -->

    <script src="../shared/constants.js"></script>
    <script src="room.js"></script>

</main>

</body>

</html>
