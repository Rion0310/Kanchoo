<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>MONSTER WAR - ROOM</title>

    <link
        rel="stylesheet"
        href="room.css"
    >

</head>

<body>

<!--
    [BGM / ページをまたいでの再生継続]
    title.html / party/index.html と同じ仕組み(../shared/menu-bgm.js)で
    再生・再開位置を引き継ぐ。battle.htmlは専用BGMを持つため、
    ここで鳴っている曲はBATTLE突入時に自然に止まる。
-->
<audio id="bgm" src="../audio/CanChokeAcoustic.mp3.mp3" loop></audio>

<main class="room-screen">

    <!-- ========================================
         ヘッダー
    ========================================= -->

    <header class="room-header">

        <div class="room-game-title">
            KANCHOO
        </div>

        <div class="room-title">
            BATTLE ROOM
        </div>

    </header>


    <!-- ========================================
         プレイヤー情報
    ========================================= -->

    <section class="player-section">

        <div class="section-label">
            PLAYER
        </div>

        <div
            id="player-name-display"
            class="player-name"
        >
            PLAYER
        </div>

    </section>

    <!-- ========================================
         卓選択
    ========================================= -->

    <section class="table-section">

        <div class="section-label">
            SELECT TABLE
        </div>


        <!-- ====================================
             対戦卓
        ===================================== -->

        <button
            type="button"
            id="battle-table"
            class="table-card"
        >

            <div class="table-card-header">

                <div class="table-name">
                    対戦卓
                </div>

                <div class="table-type">
                    BATTLE TABLE
                </div>

            </div>


            <!--
                [4人対戦対応]
                以前はPLAYER1/PLAYER2の2枠+中央のVSマークだけだったが、
                最大4人（赤・青・黄・緑）まで着席できるようにした。
                卓についている人数はここでは決め打ちせず、
                実際に着席した人数のまま試合が始まる
                （room.js側でREADY判定・自動開始を行う）。
                各枠のdata-player属性が色分け(room.css)のキーになる。
            -->
            <div class="battle-players battle-players-4">

                <div
                    id="battle-slot-1"
                    class="battle-player"
                    data-player="1"
                >

                    <div class="player-number">
                        PLAYER 1
                    </div>

                    <div
                        id="battle-player-1"
                        class="battle-player-name"
                    >
                        WAITING
                    </div>

                    <div
                        id="battle-ready-1"
                        class="ready-status"
                    >
                        WAITING
                    </div>

                </div>


                <div
                    id="battle-slot-2"
                    class="battle-player"
                    data-player="2"
                >

                    <div class="player-number">
                        PLAYER 2
                    </div>

                    <div
                        id="battle-player-2"
                        class="battle-player-name"
                    >
                        WAITING
                    </div>

                    <div
                        id="battle-ready-2"
                        class="ready-status"
                    >
                        WAITING
                    </div>

                </div>


                <div
                    id="battle-slot-3"
                    class="battle-player"
                    data-player="3"
                >

                    <div class="player-number">
                        PLAYER 3
                    </div>

                    <div
                        id="battle-player-3"
                        class="battle-player-name"
                    >
                        WAITING
                    </div>

                    <div
                        id="battle-ready-3"
                        class="ready-status"
                    >
                        WAITING
                    </div>

                </div>


                <div
                    id="battle-slot-4"
                    class="battle-player"
                    data-player="4"
                >

                    <div class="player-number">
                        PLAYER 4
                    </div>

                    <div
                        id="battle-player-4"
                        class="battle-player-name"
                    >
                        WAITING
                    </div>

                    <div
                        id="battle-ready-4"
                        class="ready-status"
                    >
                        WAITING
                    </div>

                </div>

            </div>


            <div class="table-description">
                最大4人まで参加できます。着席した全員がREADYを押すと、その人数のまま対戦が始まります。
            </div>

        </button>


        <!-- ====================================
             観戦卓
        ===================================== -->

        <button
            type="button"
            id="spectator-table"
            class="table-card"
        >

            <div class="table-card-header">

                <div class="table-name">
                    観戦卓
                </div>

                <div class="table-type">
                    SPECTATOR TABLE
                </div>

            </div>


            <div class="spectator-info">

                <div
                    id="spectator-count"
                    class="spectator-count"
                >
                    0
                </div>

                <div class="spectator-label">
                    SPECTATORS
                </div>

            </div>


            <!--
                [観戦者名の表示]
                以前は人数(spectator-count)だけを表示していたが、
                誰が観戦しているか分かるように名前一覧も表示する。
                room.js側で roomState.spectators (名前の配列) から
                この要素の中身を動的に組み立てる。
            -->
            <div
                id="spectator-names"
                class="spectator-names"
            ></div>


            <div class="table-description">
                対戦中のプレイヤーを観戦します
            </div>

        </button>


        <!--
            [卓の強制リセット]
            行儀の悪い切断などで卓が固まったとき用。中身はroom.jsが描画する。
        -->
        <div
            id="room-table-tools"
            class="room-table-tools"
        ></div>

    </section>


    <!-- ========================================
         フィールド(マップ)選択
         中身はroom.jsが shared/battle-maps.js の一覧から描画する。
    ========================================= -->

    <section class="field-section">

        <div class="section-label">
            SELECT FIELD
        </div>

        <div
            id="room-map-select"
            class="room-map-select"
        ></div>

    </section>


    <!-- ========================================
         選択中の卓
    ========================================= -->

    <section class="selection-section">

        <div class="section-label">
            SELECTED TABLE
        </div>

        <div
            id="selected-table"
            class="selected-table"
        >
            卓を選択してください
        </div>

    </section>


    <!-- ========================================
         操作ボタン
    ========================================= -->

    <section class="action-section">

        <button
            type="button"
            id="ready-button"
            class="action-button ready-button"
        >
            <span class="button-label">
                準備
            </span>

            <span class="button-subtitle">
                READY
            </span>

        </button>


        <button
            type="button"
            id="back-button"
            class="action-button back-button"
        >
            <span class="button-label">
                戻る
            </span>

            <span class="button-subtitle">
                BACK
            </span>

        </button>

    </section>


    <!-- ========================================
         接続状態
    ========================================= -->

    <div
        id="connection-status"
        class="connection-status"
    >
        CONNECTING...
    </div>


    <!-- ========================================
         JavaScript
    ========================================= -->

    <script src="../shared/constants.js"></script>
    <script src="../shared/battle-maps.js"></script>
    <script src="../shared/menu-bgm.js"></script>
    <script src="room.js"></script>

</main>

</body>

</html>
