<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MONSTER WAR</title>
<link rel="stylesheet" href="title.css">
</head>

<body>

<main class="title-screen">

    <div class="title-content">
        <!--
            [BGM / ページをまたいでの再生継続]
            以前はidが振られておらずtitle.js側のsetupBGM()が
            何も見つけられず無音のままだった。
            id="bgm" + loop を付け、../shared/menu-bgm.js が
            room.html / party/index.html と共通の仕組みで
            再生・再開位置の引き継ぎを行う。
        -->
        <audio id="bgm" src="../audio/CanChokeAcoustic.mp3" loop></audio>
        <h1 class="game-title">KANCHOO</h1>

        <div class="menu">

            <button class="menu-button" id="battle-button">
                <span class="menu-label">対戦する</span>
                <span class="menu-subtitle">ONLINE BATTLE</span>
            </button>

            <button class="menu-button" id="party-button">
                <span class="menu-label">編成する</span>
                <span class="menu-subtitle">PARTY</span>
            </button>

        </div>

        <section class="current-party">
            <div class="current-party-title">CURRENT PARTY</div>
            <div id="title-party-list" class="title-party-list"></div>
        </section>

    </div>

    <div class="copyright">
        MONSTER WAR
    </div>

</main>

<script src="../shared/constants.js"></script>
<script src="../database/game-data.js"></script>
<script src="../shared/menu-bgm.js"></script>
<script src="title.js"></script>

</body>
</html>
