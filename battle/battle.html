<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>KANCHOO BATTLE</title>

    <link
        rel="stylesheet"
        href="battle.css"
    >
</head>

<body>

<main class="battle-screen">
    <!--
        [BATTLE BGM]
        以前からこのタグ自体はあったが、再生を開始するJSが
        どこにもなく実際には鳴っていなかった。battle.js側で
        id="battle-bgm" を使って再生を開始する。
    -->
    <audio id="battle-bgm" src="../audio/CanChokeInst.mp3" loop ></audio>

    <header class="battle-header">

        <div class="battle-game-title">
            MONSTER WAR
        </div>

        <!--
            [現在ターン表示]
            中身はbattle.jsのupdateTurnIndicators()が
            手番が変わるたびに書き換える。
        -->
        <div
            id="turn-indicator"
            class="turn-indicator"
            aria-live="polite"
        ></div>

        <div class="battle-title">
            BATTLE FIELD
        </div>

    </header>


    <section class="battle-layout">

        <!--
            [4人対戦対応]
            以前はPLAYER1(左)/PLAYER2(右)の2枚だけだったが、
            最大4人分のパネルを用意した。
            どの実プレイヤーをどのパネルに表示するかはbattle.js側で
            動的に決める（自分を必ず左下(スロット1)に固定し、
            残りを時計回りに配置する）。2人対戦のときはスロット3・4は
            使われず、以前と全く同じ見た目になる。
        -->

        <!-- SLOT 1 (左下 / 2人対戦ではここがPLAYER1の定位置) -->
        <aside class="player-status player-status-1">

            <div id="player-1-name" class="player-status-header"></div>

            <div
                id="player-1-status"
                class="character-status-list"
            ></div>

        </aside>

        <!-- SLOT 3 (左上 / 3人目以降が参加したときだけ表示) -->
        <aside class="player-status-3 slot-hidden">

            <div id="player-3-name" class="player-status-header"></div>

            <div
                id="player-3-status"
                class="character-status-list"
            ></div>

        </aside>


        <!-- BATTLE FIELD -->
        <div class="field-area">

            <div class="battle-field-wrapper">

                <div
                    id="battle-field"
                    class="battle-field"
                ></div>

            </div>

        </div>


        <!--
            [BATTLE CONTROL / スマホ表示での配置修正]
            以前は.battle-layoutの外（このsection全体の後）に
            置かれていたため、スマホ表示ではパーティ表示(各player-status)の
            さらに下にUIが来てしまい操作しづらかった。
            PC表示ではposition:fixedで画面に張り付くため、
            DOM上のこの位置に移動しても見た目は変わらない。
            スマホ表示のみ、盤面(.field-area)の直下に来るよう
            battle.css側でorderを指定している。
        -->
        <section
            id="battle-control-panel"
            class="battle-control-panel"
        ></section>


        <!-- SLOT 2 (右下 / 2人対戦ではここがPLAYER2の定位置) -->
        <aside class="player-status player-status-2">

            <div id="player-2-name" class="player-status-header"></div>

            <div
                id="player-2-status"
                class="character-status-list"
            ></div>

        </aside>

        <!-- SLOT 4 (右上 / 4人目が参加したときだけ表示) -->
        <aside class="player-status-4 slot-hidden">

            <div id="player-4-name" class="player-status-header"></div>

            <div
                id="player-4-status"
                class="character-status-list"
            ></div>

        </aside>

    </section>

</main>


<script src="../shared/constants.js"></script>
<script src="../database/game-data.js"></script>
<!-- [フィールド形状] マップ定義(ROOM・サーバーと共通)。battle.jsより先に読み込む -->
<script src="../shared/battle-maps.js"></script>
<!-- [FX] 技のエフェクト。battle.jsより先に読み込む -->
<script src="battle-fx.js"></script>
<script src="battle.js"></script>

</body>

</html>
