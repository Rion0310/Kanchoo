<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>KANCHOO BATTLE</title>

    <link
        rel="stylesheet"
        href="battle.css"
    >
</head>

<body>

<main class="battle-screen">
    <audio src="../audio/CanChokeAcoustic.mp3" loop ></audio>

    <header class="battle-header">

        <div class="battle-game-title">
            MONSTER WAR
        </div>

        <div class="battle-title">
            BATTLE FIELD
        </div>

    </header>


    <section class="battle-layout">

        <!-- PLAYER 1 -->
        <aside class="player-status player-status-1">

            <div id="player-1-name" class="player-status-header">
                PLAYER1
            </div>

            <div
                id="player-1-status"
                class="character-status-list"
            ></div>

        </aside>


        <!-- BATTLE FIELD -->
        <div class="field-area">

            <div class="battle-field-wrapper">

                <div
                    id="battle-field"
                    class="battle-field"
                ></div>

            </div>

        </div>


        <!-- PLAYER 2 -->
        <aside class="player-status player-status-2">

            <div id="player-2-name" class="player-status-header">
                PLAYER2
            </div>

            <div
                id="player-2-status"
                class="character-status-list"
            ></div>

        </aside>

    </section>


    <!-- BATTLE CONTROL -->
    <section
        id="battle-control-panel"
        class="battle-control-panel"
    ></section>

</main>


<script src="../database/game-data.js"></script>
<script src="battle.js"></script>

</body>

</html>
